<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Price Compare</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="chat"></div>

<div class="controls">
  <div class="mode">
    <label><input type="radio" name="mode" value="normal" checked> Amazon / Flipkart</label>
    <label><input type="radio" name="mode" value="quick"> Amazon Now / Flipkart Minutes</label>
  </div>

  <input id="query" placeholder="Ask me anything..." />
  <button onclick="send()">Compare</button>
</div>

<script src="app.js"></script>
</body>
</html>
